name: Publish newsletter at noon KST

on:
  schedule:
    # Seoul backup attempts; the primary path is an early approved main push.
    - cron: '57 2 * * *'
    - cron: '3,9,17,23 3 * * *'
  push:
    branches: [main]
    paths:
      - 'tech/operations/release-request.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect only: do not publish or send mail'
        type: boolean
        default: true
      allow_late:
        description: 'Explicit same-day recovery after 12:30 KST (requires issue, date and reason)'
        type: boolean
        default: false
      confirm_recovery:
        description: 'Explicitly confirm recovery of the named same-day issue; preserve receipts'
        type: boolean
        default: false
      recovery_issue_id:
        description: 'Exact existing issue ID; never change the ID to resend'
        type: string
        required: false
      recovery_date:
        description: 'Current Seoul date, YYYY-MM-DD'
        type: string
        required: false
      recovery_reason:
        description: 'Recovery reason, 10-300 characters; no personal data or secrets'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: newsletter-noon-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Record trigger diagnostics without credentials
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          node --input-type=module -e 'console.log(JSON.stringify({event:process.env.TRIGGER_EVENT,cron:process.env.TRIGGER_CRON||null,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,actualUtc:new Date().toISOString(),ref:process.env.GITHUB_REF,sha:process.env.GITHUB_SHA}))'
      - name: Check release and content contracts without live email
        id: contracts
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test tech/scripts/content.test.mjs tech/scripts/release.test.mjs tech/scripts/delivery-client.test.mjs tech/scripts/warm-release.test.mjs tech/src/subscriptions.test.mjs tech/deploy/ensure-pages-project.test.mjs tech/integrations/cloudflare-email.test.mjs
      - name: Check authenticated delivery connection without sending email
        id: connection
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node tech/scripts/deliver.mjs --check
      - name: Install Pandoc before the timed release
        id: pandoc
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && steps.connection.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pandoc
      - name: Arm an already-running worker until 11:57 KST
        id: warm
        run: node tech/scripts/warm-release.mjs
      - name: Apply release gate or explicit bounded recovery
        id: gate
        run: node tech/scripts/release.mjs --from-event
      - name: Build or inspect the exact issue before any publication
        id: build
        if: steps.gate.outputs.changed == 'true' || steps.gate.outputs.dry_run == 'true'
        working-directory: tech
        run: npm run build
      - name: Publish the validated status change without force-pushing
        id: publish
        if: steps.gate.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tech/content/issues.json
          git commit -m "Publish validated newsletter issue"
          git push origin HEAD:main
      - name: Deliver the live issue to confirmed subscribers
        id: deliver
        if: steps.gate.outputs.issue_ids != '' && steps.gate.outputs.dry_run == 'false'
        env:
          ISSUE_IDS: ${{ steps.gate.outputs.issue_ids }}
          ISSUE_DATE: ${{ steps.gate.outputs.issue_date }}
        run: node tech/scripts/deliver.mjs
      - name: Read-only production article image Markdown ZIP and RSS inspection
        id: inspect
        if: steps.gate.outputs.issue_ids != '' && steps.gate.outputs.dry_run == 'true'
        env:
          ISSUE_IDS: ${{ steps.gate.outputs.issue_ids }}
        run: node tech/scripts/inspect-live.mjs
      - name: Record failure and recovery instructions
        if: failure()
        run: |
          printf '%s\n' '## 발행 또는 발송 확인이 필요합니다' '실패 단계와 unresolved를 확인하고 tech/docs/RECOVERY.md를 따르세요.' 'receipt 삭제, 호 ID 변경, 임의 수신자 발송은 금지합니다. API 수락은 받은편지함 도착과 다릅니다.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare diagnostic snapshot even after failure
        id: result
        if: always()
        env:
          RESULT_KIND: release
          REQUIRED_STEPS: checkout,node,contracts,connection,pandoc,warm,gate${{ steps.gate.outputs.changed == 'true' && ',build,publish' || '' }}${{ steps.gate.outputs.issue_ids != '' && steps.gate.outputs.dry_run == 'false' && ',deliver' || '' }}${{ steps.gate.outputs.issue_ids != '' && steps.gate.outputs.dry_run == 'true' && ',build,inspect' || '' }}
          STEP_RESULTS: ${{ toJSON(steps) }}
          RESULT_PHASE: artifact
        run: |
          if [ -f tools/ci/workflow-result.mjs ]; then
            node tools/ci/workflow-result.mjs
          else
            mkdir -p .workflow-results
            printf '%s\n' '{"version":1,"verdict":"setup_failed"}' > .workflow-results/workflow-result.json
            printf '%s\n' 'Source setup failed; diagnostics could not load.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Save diagnostic snapshot even after failure
        id: upload_result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-result-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workflow-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Record final outcome even after failure
        if: always()
        env:
          RESULT_KIND: release
          REQUIRED_STEPS: checkout,node,contracts,connection,pandoc,warm,gate${{ steps.gate.outputs.changed == 'true' && ',build,publish' || '' }}${{ steps.gate.outputs.issue_ids != '' && steps.gate.outputs.dry_run == 'false' && ',deliver' || '' }}${{ steps.gate.outputs.issue_ids != '' && steps.gate.outputs.dry_run == 'true' && ',build,inspect' || '' }},result,upload_result
          STEP_RESULTS: ${{ toJSON(steps) }}
          RESULT_PHASE: final
        run: |
          if [ -f tools/ci/workflow-result.mjs ]; then
            node tools/ci/workflow-result.mjs
          else
            mkdir -p .workflow-results
            printf '%s\n' '{"version":1,"verdict":"setup_failed"}' > .workflow-results/workflow-result.json
            printf '%s\n' 'Source setup failed; diagnostics could not load.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
