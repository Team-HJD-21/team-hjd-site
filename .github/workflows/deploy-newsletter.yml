# Install this file at repository root: .github/workflows/deploy-newsletter.yml
name: Build and deploy newsletter

on:
  pull_request:
    paths:
      - 'tech/**'
      - '.github/workflows/deploy-newsletter.yml'
  push:
    branches: [main]
    paths:
      - 'tech/**'
      - '.github/workflows/deploy-newsletter.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the website publicly to Cloudflare Pages'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: newsletter-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc

      - name: Verify project provisioning safeguards
        run: node --test tech/deploy/ensure-pages-project.test.mjs tech/integrations/cloudflare-email.test.mjs tech/scripts/content.test.mjs

      - name: Validate daily content contract
        working-directory: tech
        run: npm run validate

      - name: Build newsletter
        working-directory: tech
        run: npm run build

      - name: Save static website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gambungi-notes-site
          path: tech/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Ensure the intended Pages project exists
        if: >-
          ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
          (github.event_name == 'push' && vars.NEWSLETTER_AUTO_DEPLOY == 'true')) }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tech/deploy/ensure-pages-project.mjs

      - name: Publish newsletter to Cloudflare Pages
        if: >-
          ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
          (github.event_name == 'push' && vars.NEWSLETTER_AUTO_DEPLOY == 'true')) }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tech
          packageManager: npm
          command: pages deploy dist --project-name=gambungi-notes --branch=main
