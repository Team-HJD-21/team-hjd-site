# Install this file at repository root: .github/workflows/deploy-newsletter.yml
name: Validate newsletter

on:
  pull_request:
    paths:
      - 'tech/**'
      - 'index.html'
      - 'styles.css'
      - 'assets/teamhjd-wordmark.png'
      - 'assets/favicons/v1/**'
      - '.github/workflows/deploy-newsletter.yml'
      - '.github/workflows/publish-newsletter.yml'
      - '.github/workflows/monitor-newsletter.yml'
      - 'tools/newsletter-monitor/**'
      - 'tools/Open-NewsletterMonitor.ps1'
  push:
    branches: [main]
    paths:
      - 'tech/**'
      - 'index.html'
      - 'styles.css'
      - 'assets/teamhjd-wordmark.png'
      - 'assets/favicons/v1/**'
      - '.github/workflows/deploy-newsletter.yml'
      - '.github/workflows/publish-newsletter.yml'
      - '.github/workflows/monitor-newsletter.yml'
      - 'tools/newsletter-monitor/**'
      - 'tools/Open-NewsletterMonitor.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Validate daily content contract
        working-directory: tech
        run: npm run validate

      - name: Verify the Cloudflare build entrypoint and official Pandoc bootstrap
        working-directory: tech
        env:
          PANDOC_PATH: /tmp/gambungi-ci-bootstrap-pandoc
        run: npm run build:cloudflare

      - name: Save static website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gambungi-notes-site
          path: tech/dist/
          if-no-files-found: error
          retention-days: 7
