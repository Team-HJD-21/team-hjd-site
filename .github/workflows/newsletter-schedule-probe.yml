name: Newsletter schedule diagnostic (temporary)

on:
  schedule:
    # Temporary, non-delivery probe. UTC. Remove after diagnosis.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record actual schedule dispatch lag
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "event=$EVENT_NAME"
          echo "cron=$SCHEDULE"
          echo "actual_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "run_id=$RUN_ID"
          echo "No newsletter publication, email, secrets or write permissions are used."
