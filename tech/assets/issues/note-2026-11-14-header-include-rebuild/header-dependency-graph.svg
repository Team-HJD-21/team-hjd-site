<text x="873" y="379" text-anchor="middle" font-family="monospace" font-size="14" fill="#a2afab">audio.cpp</text>
<text x="46" y="438" font-family="sans-serif" font-size="15" fill="#a2afab">주어진 예제에서 연결된 번역 단위 3개 · 독립 번역 단위 1개</text>
