<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-label="겜붕이의 노트 물리 시간선 직접 제작 도식"><rect x="0" y="0" width="1080" height="440" fill="#080f17"/><rect x="32" y="22" width="1016" height="396" rx="16" fill="#13202c"/><text x="64" y="70" font-size="29" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">같은 렌더 순간, 서로 다른 표시 위치</text><text x="64" y="105" font-size="17" fill="#a2afab" text-anchor="start" font-family="sans-serif">렌더 시각 50ms · 초속 2m · 물리 시각 40ms까지 완료</text><line x1="220" y1="218" x2="900" y2="218" stroke="#a2afab" stroke-width="3" /><text x="70" y="224" font-size="18" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">x 위치</text><line x1="220" y1="206" x2="220" y2="234" stroke="#a2afab" stroke-width="2" /><text x="220" y="260" font-size="15" fill="#a2afab" text-anchor="middle" font-family="sans-serif">0.00</text><line x1="333.33333333333337" y1="206" x2="333.33333333333337" y2="234" stroke="#a2afab" stroke-width="2" /><text x="333.33333333333337" y="260" font-size="15" fill="#a2afab" text-anchor="middle" font-family="sans-serif">0.02</text><line x1="446.6666666666667" y1="206" x2="446.6666666666667" y2="234" stroke="#a2afab" stroke-width="2" /><text x="446.6666666666667" y="260" font-size="15" fill="#a2afab" text-anchor="middle" font-family="sans-serif">0.04</text><line x1="560" y1="206" x2="560" y2="234" stroke="#a2afab" stroke-width="2" /><text x="560" y="260" font-size="15" fill="#a2afab" text-anchor="middle" font-family="sans-serif">0.06</text><line x1="673.3333333333334" y1="206" x2="673.3333333333334" y2="234" stroke="#a2afab" stroke-width="2" /><text x="673.3333333333334" y="260" font-size="15" fill="#a2afab" text-anchor="middle" font-family="sans-serif">0.08</text><line x1="786.6666666666667" y1="206" x2="786.6666666666667" y2="234" stroke="#a2afab" stroke-width="2" /><text x="786.6666666666667" y="260" font-size="15" fill="#a2afab" text-anchor="middle" font-family="sans-serif">0.10</text><line x1="900" y1="206" x2="900" y2="234" stroke="#a2afab" stroke-width="2" /><text x="900" y="260" font-size="15" fill="#a2afab" text-anchor="middle" font-family="sans-serif">0.12</text><line x1="560" y1="217" x2="560" y2="305" stroke="#d9eea6" stroke-width="2" stroke-dasharray="4 4"/><circle cx="560" cy="217" r="8" fill="#d9eea6"/><text x="569" y="305" font-size="17" fill="#d9eea6" text-anchor="start" font-family="sans-serif">보간 0.060m</text><line x1="673.3333333333334" y1="217" x2="673.3333333333334" y2="339" stroke="#a2afab" stroke-width="2" stroke-dasharray="4 4"/><circle cx="673.3333333333334" cy="217" r="8" fill="#a2afab"/><text x="682.3333333333334" y="339" font-size="17" fill="#a2afab" text-anchor="start" font-family="sans-serif">보간 없음 0.080m</text><line x1="786.6666666666667" y1="217" x2="786.6666666666667" y2="373" stroke="#f3f0e8" stroke-width="2" stroke-dasharray="4 4"/><circle cx="786.6666666666667" cy="217" r="8" fill="#f3f0e8"/><text x="795.6666666666667" y="373" font-size="17" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">등속 기준 0.100m</text><text x="68" y="155" font-size="18" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">보간은 ‘현재에 가까운 값’이 아니라 ‘한 스텝 지연된 매끄러운 표시’를 택합니다.</text></svg>
