<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="325" viewBox="0 0 1000 325" role="img" aria-label="20밀리초의 물리 스텝에서 총알이 5밀리초에 벽에 닿으며 정규화된 시간은 0.25">
<rect width="1000" height="325" fill="#080f17"/>
<text x="50" y="52" fill="#f3f0e8" font-family="sans-serif" font-size="27" font-weight="700">충돌 시점(Time of Impact) 찾기</text>
<rect x="40" y="83" width="920" height="199" rx="14" fill="#13202c"/>
<line x1="120" y1="181" x2="880" y2="181" stroke="#a2afab" stroke-width="12" stroke-linecap="round"/>
<line x1="120" y1="181" x2="310" y2="181" stroke="#d9eea6" stroke-width="12" stroke-linecap="round"/>
<circle cx="120" cy="181" r="10" fill="#f3f0e8"/>
<circle cx="310" cy="181" r="13" fill="#d9eea6"/>
<circle cx="880" cy="181" r="10" fill="#f3f0e8"/>
<line x1="310" y1="128" x2="310" y2="240" stroke="#d9eea6" stroke-width="2" stroke-dasharray="5 6"/>
<text x="120" y="132" fill="#f3f0e8" font-family="sans-serif" font-size="20" text-anchor="middle">0ms</text>
<text x="310" y="116" fill="#d9eea6" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">5ms · 첫 접촉</text>
<text x="880" y="132" fill="#f3f0e8" font-family="sans-serif" font-size="20" text-anchor="middle">20ms</text>
<text x="120" y="225" fill="#a2afab" font-family="sans-serif" font-size="18" text-anchor="middle">x = 0.80m</text>
<text x="310" y="265" fill="#d9eea6" font-family="sans-serif" font-size="18" text-anchor="middle">x = 0.90m</text>
<text x="880" y="225" fill="#a2afab" font-family="sans-serif" font-size="18" text-anchor="middle">x = 1.20m*</text>
<text x="50" y="312" fill="#a2afab" font-family="sans-serif" font-size="15">t = (0.90 − 0.80) / 20 = 0.005s · 비율 0.005 / 0.020 = 0.25 · *충돌 응답이 없을 때의 예상 위치</text>
</svg>