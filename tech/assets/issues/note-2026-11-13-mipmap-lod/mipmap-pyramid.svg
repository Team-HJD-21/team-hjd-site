<svg xmlns="http://www.w3.org/2000/svg" width="940" height="365" viewBox="0 0 940 365"><rect width="940" height="365" fill="#080f17"/><text x="30" y="41" font-size="24" font-weight="700" fill="#f3f0e8">밉맵: 해상도를 절반씩 줄인 계층</text><text x="30" y="65" font-size="15" fill="#a2afab">가로·세로 1/2, 텍셀 수 1/4씩 감소 · 레벨 3은 원본의 1/8 해상도</text><rect x="30" y="91" width="191" height="229" rx="16" fill="#13202c" stroke="#36505a"/><text x="46" y="124" fill="#f3f0e8" font-size="18" font-weight="700">Level 0</text><text x="46" y="150" fill="#a2afab" font-size="15">1024 × 1024</text><rect x="73" y="183" width="104" height="104" fill="#54737d" stroke="#f3f0e8" stroke-width="1.5"/><text x="46" y="303" fill="#a2afab" font-size="13">원본 텍스처</text><rect x="257" y="91" width="191" height="229" rx="16" fill="#13202c" stroke="#36505a"/><text x="273" y="124" fill="#f3f0e8" font-size="18" font-weight="700">Level 1</text><text x="273" y="150" fill="#a2afab" font-size="15">512 × 512</text><rect x="313" y="196" width="78" height="78" fill="#54737d" stroke="#f3f0e8" stroke-width="1.5"/><text x="273" y="303" fill="#a2afab" font-size="13">1/2</text><rect x="484" y="91" width="191" height="229" rx="16" fill="#13202c" stroke="#36505a"/><text x="500" y="124" fill="#f3f0e8" font-size="18" font-weight="700">Level 2</text><text x="500" y="150" fill="#a2afab" font-size="15">256 × 256</text><rect x="553" y="209" width="52" height="52" fill="#54737d" stroke="#f3f0e8" stroke-width="1.5"/><text x="500" y="303" fill="#a2afab" font-size="13">1/4</text><rect x="711" y="91" width="191" height="229" rx="16" fill="#13202c" stroke="#36505a"/><text x="727" y="124" fill="#f3f0e8" font-size="18" font-weight="700">Level 3</text><text x="727" y="150" fill="#a2afab" font-size="15">128 × 128</text><rect x="793" y="222" width="26" height="26" fill="#d9eea6" stroke="#f3f0e8" stroke-width="1.5"/><text x="727" y="303" fill="#a2afab" font-size="13">1/8 · 예제의 선택</text><path d="M 231 202 h 23 m -9 -8 l 9 8 -9 8" fill="none" stroke="#d9eea