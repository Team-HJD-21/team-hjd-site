<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<rect width="1000" height="430" fill="#080f17"/>
<text x="40" y="57" fill="#f3f0e8" font-family="sans-serif" font-size="29" font-weight="700">HP-only scan · 1,024 actors</text>
<text x="40" y="94" fill="#a2afab" font-family="sans-serif" font-size="17">64 B aligned lines · data footprint model, not a performance benchmark</text>
