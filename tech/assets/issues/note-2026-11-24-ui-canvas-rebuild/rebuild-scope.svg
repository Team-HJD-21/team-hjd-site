<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><rect width="1000" height="380" fill="#080f17"/><text x="36" y="50" font-family="sans-serif" font-size="30" fill="#f3f0e8">60 updates / illustrative scope count</text><text x="36" y="82" font-family="sans-serif" font-size="20" fill="#a2afab">Not milliseconds, draw calls or measured speedup</text><rect x="36" y="108" width="928" height="105" rx="10" fill="#13202c" stroke="#a2afab" stroke-width="2"/><rect x="36" y="228" width="928" height="105" rx="10" fill="#13202c" stroke="#a2afab" stroke-width="2"/><text x="56" y="146" font-family="sans-serif" font-size="24" fill="#f3f0e8">Single Canvas</text><text x="56" y="181" font-family="sans-serif" font-size="25" fill="#d9eea6">101 × 60 = 6,060</text><rect x="360" y="140" width="560" height="30" rx="3" fill="#d9eea6"/><text x="56" y="266" font-family="sans-serif" font-size="24" fill="#f3f0e8">Split Canvas</text><text x="56" y="301" font-family="sans-serif" font-size="25" fill="#d9eea6">1 × 60 = 60</text><rect x="360" y="260" width="5.544554455445544" height="30" fill="#d9eea6"/><text x="380" y="283" font-family="sans-serif" font-size="20" fill="#a2afab">60</text><text x="36" y="359" font-family="sans-serif" font-size="20" fill="#a2afab">Bar lengths proportional to scope totals: 6060 vs 60</text></svg>
