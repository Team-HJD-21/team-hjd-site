<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="A스타 우선순위 큐의 값 계산 네 단계"><rect width="1000" height="540" fill="#080f17"/><rect x="28" y="20" width="944" height="496" rx="16" fill="#13202c"/><text x="55" y="66" font-size="28" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">f = g + h  ·  후보가 바뀌는 네 단계</text><text x="55" y="100" font-size="18" fill="#a2afab" text-anchor="start" font-family="sans-serif">최소 f부터 살피며, 목표 G가 처음 발견됐다고 종료하지 않습니다.</text><rect x="54" y="133" width="893" height="78" rx="10" fill="#080f17" stroke="#32414c" stroke-width="1"/><text x="76" y="162" font-size="21" fill="#d9eea6" text-anchor="start" font-family="sans-serif">1 · S 확장</text><text x="283" y="161" font-size="18" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">A: g2+h1 = 3</text><text x="283" y="190" font-size="17" fill="#a2afab" text-anchor="start" font-family="sans-serif">B: g3+h3 = 6</text><text x="829" y="179" font-size="18" fill="#d9eea6" text-anchor="middle" font-family="sans-serif">A 우선</text><rect x="54" y="224" width="893" height="78" rx="10" fill="#080f17" stroke="#32414c" stroke-width="1"/><text x="76" y="253" font-size="21" fill="#d9eea6" text-anchor="start" font-family="sans-serif">2 · A 확장</text><text x="283" y="252" font-size="18" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">G: g11+h0 = 11</text><text x="283" y="281" font-size="17" fill="#a2afab" text-anchor="start" font-family="sans-serif">B: f = 6 대기</text><text x="829" y="270" font-size="18" fill="#d9eea6" text-anchor="middle" font-family="sans-serif">B 우선</text><rect x="54" y="315" width="893" height="78" rx="10" fill="#080f17" stroke="#32414c" stroke-width="1"/><text x="76" y="344" font-size="21" fill="#d9eea6" text-anchor="start" font-family="sans-serif">3 · B 확장</text><text x="283" y="343" font-size="18" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">C: g4+h2 = 6</text><text x="283" y="372" font-size="17" fill="#a2afab" text-anchor="start" font-family="sans-serif">G: f = 11 대기</text><text x="829" y="361" font-size="18" fill="#d9eea6" text-anchor="middle" font-family="sans-serif">C 우선</text><rect x="54" y="406" width="893" height="78" rx="10" fill="#080f17" stroke="#32414c" stroke-width="1"/><text x="76" y="435" font-size="21" fill="#d9eea6" text-anchor="start" font-family="sans-serif">4 · C 확장</text><text x="283" y="434" font-size="18" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">G: g6+h0 = 6</text><text x="283" y="463" font-size="17" fill="#a2afab" text-anchor="start" font-family="sans-serif">이전 G: 11 무시</text><text x="829" y="452" font-size="18" fill="#d9eea6" text-anchor="middle" font-family="sans-serif">G 확정</text><text x="56" y="507" font-size="19" fill="#d9eea6" text-anchor="start" font-family="sans-serif">최종 결과: S → B → C → G  ·  총비용 6</text></svg>