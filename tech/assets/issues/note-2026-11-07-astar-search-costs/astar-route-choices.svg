<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="A스타 탐색 경로 두 개의 단방향 그래프"><rect width="1000" height="480" fill="#080f17"/><rect x="28" y="20" width="944" height="440" rx="16" fill="#13202c"/><text x="56" y="66" font-size="29" fill="#f3f0e8" text-anchor="start" font-family="sans-serif">A* 예제 · 위 경로는 11, 아래 경로는 6</text><text x="56" y="99" font-size="17" fill="#a2afab" text-anchor="start" font-family="sans-serif">화살표는 단방향 · 노드 아래 수치는 남은 비용의 추정 h</text><line x1="164.5" y1="198.0" x2="303.8" y2="132.7" stroke="#a2afab" stroke-width="4"/><polygon points="303.8,132.7 295.0,144.5 289.1,131.9" fill="#a2afab"/><text x="225" y="133" font-size="18" fill="#a2afab" text-anchor="middle" font-family="sans-serif">비용 2</text><line x1="396.0" y1="120.4" x2="823.0" y2="207.8" stroke="#a2afab" stroke-width="4"/><polygon points="823.0,207.8 808.9,212.0 811.7,198.3" fill="#a2afab"/><text x="632" y="125" font-size="18" fill="#a2afab" text-anchor="middle" font-family="sans-serif">비용 9</text><line x1="163.4" y1="240.2" x2="305.0" y2="315.9" stroke="#d9eea6" stroke-width="4"/><polygon points="305.0,315.9 290.3,316.0 296.9,303.6" fill="#d9eea6"/><text x="216" y="308" font-size="18" fill="#d9eea6" text-anchor="middle" font-family="sans-serif">비용 3</text><line x1="397.0" y1="340.0" x2="557.0" y2="340.0" stroke="#d9eea6" stroke-width="4"/><polygon points="557.0,340.0 544.0,347.0 544.0,333.0" fill="#d9eea6"/><text x="479" y="316" font-size="18" fill="#d9eea6" text-anchor="middle" font-family="sans-serif">비용 1</text><line x1="650.7" y1="320.3" x2="826.7" y2="239.3" stroke="#d9eea6" stroke-width="4"/><polygon points="826.7,239.3 817.8,251.1 811.9,238.4" fill="#d9eea6"/><text x="756" y="301" font-size="18" fill="#d9eea6" text-anchor="middle" font-family="sans-serif">비용 2</text><circle cx="122" cy="218" r="43" fill="#080f17" stroke="#d9eea6" stroke-width="3"/><text x="122" y="219" font-size="25" fill="#f3f0e8" text-anchor="middle" font-family="sans-serif">S</text><text x="122" y="243" font-size="14" fill="#a2afab" text-anchor="middle" font-family="sans-serif">h=3</text><circle cx="350" cy="111" r="43" fill="#080f17" stroke="#a2afab" stroke-width="3"/><text x="350" y="112" font-size="25" fill="#f3f0e8" text-anchor="middle" font-family="sans-serif">A</text><text x="350" y="136" font-size="14" fill="#a2afab" text-anchor="middle" font-family="sans-serif">h=1</text><circle cx="350" cy="340" r="43" fill="#080f17" stroke="#d9eea6" stroke-width="3"/><text x="350" y="341" font-size="25" fill="#f3f0e8" text-anchor="middle" font-family="sans-serif">B</text><text x="350" y="365" font-size="14" fill="#a2afab" text-anchor="middle" font-family="sans-serif">h=3</text><circle cx="608" cy="340" r="43" fill="#080f17" stroke="#d9eea6" stroke-width="3"/><text x="608" y="341" font-size="25" fill="#f3f0e8" text-anchor="middle" font-family="sans-serif">C</text><text x="608" y="365" font-size="14" fill="#a2afab" text-anchor="middle" font-family="sans-serif">h=2</text><circle cx="873" cy="218" r="43" fill="#080f17" stroke="#d9eea6" stroke-width="3"/><text x="873" y="219" font-size="25" fill="#f3f0e8" text-anchor="middle" font-family="sans-serif">G</text><text x="873" y="243" font-size="14" fill="#a2afab" text-anchor="middle" font-family="sans-serif">h=0</text><text x="55" y="425" font-size="19" fill="#a2afab" text-anchor="start" font-family="sans-serif">상단: S → A → G = 2+9 = 11</text><text x="533" y="425" font-size="19" fill="#d9eea6" text-anchor="start" font-family="sans-serif">하단: S → B → C → G = 3+1+2 = 6</text></svg>