<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">GPU 읽기 요청과 버퍼 수명의 흐름</title><desc id="desc">GPU 실행부터 비동기 요청, 완료 콜백, 값 사용, 버퍼 해제 순서를 보여준다. 비동기 요청 중에는 원본 버퍼를 보존한다.</desc><rect width="1120" height="290" fill="#080f17"/><text x="43" y="52" fill="#f3f0e8" font-family="sans-serif" font-size="26" font-weight="bold">완료되기 전에는 버퍼를 놓지 않습니다</text><rect x="36" y="89" width="195" height="106" rx="12" fill="#13202c" stroke="#3a5264" stroke-width="1"/><text x="134" y="133" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f3f0e8" font-weight="700">GPU 실행</text><text x="134" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a2afab">0ms  |  16B 쓰기</text><path d="M 233 143 h 21" stroke="#d9eea6" stroke-width="2"/><path d="M 247 138 l 7 5 -7 5" fill="none" stroke="#d9eea6" stroke-width="2"/><rect x="256" y="89" width="195" height="106" rx="12" fill="#13202c" stroke="#3a5264" stroke-width="1"/><text x="354" y="133" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f3f0e8" font-weight="700">비동기 요청</text><text x="354" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a2afab">CPU는 계속 실행</text><path d="M 453 143 h 21" stroke="#d9eea6" stroke-width="2"/><path d="M 467 138 l 7 5 -7 5" fill="none" stroke="#d9eea6" stroke-width="2"/><rect x="476" y="89" width="195" height="106" rx="12" fill="#13202c" stroke="#d9eea6" stroke-width="2"/><text x="574" y="133" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f3f0e8" font-weight="700">완료 콜백</text><text x="574" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a2afab">hasError 확인</text><path d="M 673 143 h 21" stroke="#d9eea6" stroke-width="2"/><path d="M 687 138 l 7 5 -7 5" fill="none" stroke="#d9eea6" stroke-width="2"/><rect x="696" y="89" width="195" height="106" rx="12" fill="#13202c" stroke="#3a5264" stroke-width="1"/><text x="794" y="133" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f3f0e8" font-weight="700">CPU 값 사용</text><text x="794" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a2afab">필요하면 복사</text><path d="M 893 143 h 21" stroke="#d9eea6" stroke-width="2"/><path d="M 907 138 l 7 5 -7 5" fill="none" stroke="#d9eea6" stroke-width="2"/><rect x="916" y="89" width="195" height="106" rx="12" fill="#13202c" stroke="#3a5264" stroke-width="1"/><text x="1014" y="133" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f3f0e8" font-weight="700">버퍼 해제</text><text x="1014" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a2afab">완료 뒤 Release</text><path d="M 50 231 H 885" stroke="#d9eea6" stroke-width="3" stroke-linecap="round"/><path d="M 50 225 V 238 M 885 225 V 238" stroke="#d9eea6" stroke-width="3"/><text x="470" y="260" fill="#d9eea6" text-anchor="middle" font-family="sans-serif" font-size="17">요청하는 동안 원본 ComputeBuffer를 유지합니다</text></svg>