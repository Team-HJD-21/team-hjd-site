<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">동기 GPU 읽기와 비동기 읽기의 가정 시간선</title><desc id="desc">GPU가 6밀리초에 결과를 완성하고 CPU가 2밀리초에 읽기 시작하는 가정. 동기 읽기는 4밀리초 기다리지만 비동기 요청은 CPU가 다른 일을 할 수 있다.</desc><rect width="1120" height="470" fill="#080f17"/><text x="44" y="49" fill="#f3f0e8" font-size="27" font-weight="700" font-family="sans-serif">16바이트보다 중요한 것은 기다리는 시점</text><text x="44" y="79" fill="#a2afab" font-size="17" font-family="sans-serif">가정: GPU 결과 t=6ms / CPU 읽기 요청 t=2ms · 실제 측정치가 아닙니다</text><rect x="32" y="120" width="1056" height="126" rx="14" fill="#13202c"/><text x="48" y="171" fill="#d9eea6" font-size="18" font-weight="bold" font-family="sans-serif">동기 GetData</text><rect x="220" y="148" width="197" height="38" rx="5" fill="#304757"/><text x="318.5" y="173" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif" font-size="16">CPU 작업</text><rect x="420" y="148" width="397" height="38" rx="5" fill="#a9766c"/><text x="618.5" y="173" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif" font-size="16">결과 대기 4ms</text><rect x="820" y="148" width="197" height="38" rx="5" fill="#304757"/><text x="918.5" y="173" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif" font-size="16">계속 진행</text><rect x="220" y="198" width="600" height="16" rx="3" fill="#6686ac"/><text x="520" y="212" text-anchor="middle" fill="#080f17" font-size="12" font-family="sans-serif">GPU 처리 0 → 6ms</text><text x="220" y="140" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">0ms</text><text x="420" y="140" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">2ms</text><text x="620" y="140" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">4ms</text><text x="820" y="140" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">6ms</text><text x="1020" y="140" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">8ms</text><rect x="32" y="280" width="1056" height="126" rx="14" fill="#13202c"/><text x="48" y="331" fill="#d9eea6" font-size="18" font-weight="bold" font-family="sans-serif">비동기 Request</text><rect x="220" y="308" width="197" height="38" rx="5" fill="#304757"/><text x="318.5" y="333" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif" font-size="16">CPU 작업</text><rect x="420" y="308" width="397" height="38" rx="5" fill="#477667"/><text x="618.5" y="333" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif" font-size="16">다른 작업 가능</text><rect x="820" y="308" width="197" height="38" rx="5" fill="#304757"/><text x="918.5" y="333" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif" font-size="16">결과 처리*</text><rect x="220" y="358" width="600" height="16" rx="3" fill="#6686ac"/><text x="520" y="372" text-anchor="middle" fill="#080f17" font-size="12" font-family="sans-serif">GPU 처리 0 → 6ms</text><text x="220" y="300" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">0ms</text><text x="420" y="300" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">2ms</text><text x="620" y="300" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">4ms</text><text x="820" y="300" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">6ms</text><text x="1020" y="300" text-anchor="middle" fill="#a2afab" font-family="monospace" font-size="13">8ms</text><text x="48" y="447" fill="#a2afab" font-size="15" font-family="sans-serif">* 비동기 완료 콜백은 6ms보다 늦을 수 있으며, 정해진 시각에 호출된다는 뜻이 아닙니다.</text></svg>