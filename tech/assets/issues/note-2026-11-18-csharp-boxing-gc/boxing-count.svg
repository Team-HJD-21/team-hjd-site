<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><rect width="960" height="370" fill="#080f17"/><text x="38" y="51" font-family="sans-serif" font-size="27" font-weight="bold" fill="#f3f0e8">같은 10,000회 호출, 다른 매개변수 경로</text><rect x="38" y="82" width="884" height="250" rx="16" fill="#13202c"/><text x="68" y="133" font-family="monospace" font-size="21" fill="#f3f0e8">ReadInterface(value)</text><rect x="375" y="111" width="457" height="33" rx="6" fill="#a2afab"/><text x="838" y="135" font-family="sans-serif" font-size="20" fill="#080f17" text-anchor="end">10,000회</text><text x="68" y="210" font-family="monospace" font-size="21" fill="#f3f0e8">ReadGeneric(ref value)</text><rect x="375" y="188" width="4" height="33" fill="#d9eea6"/><text x="838" y="211" font-family="sans-serif" font-size="20" fill="#d9eea6" text-anchor="end">0회</text><text x="68" y="284" font-family="sans-serif" font-size="19" fill="#a2afab">표시값: 인터페이스 변환에 의한 박싱 지점 수</text><text x="38" y="355" font-family="sans-serif" font-size="17" fill="#a2afab">실제 GC 할당 바이트 또는 프레임 시간의 측정 결과가 아닙니다.</text></svg>