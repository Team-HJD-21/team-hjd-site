<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<rect width="1000" height="340" fill="#080f17"/>
<rect x="24" y="20" width="952" height="300" rx="16" fill="#13202c"/>
<text x="52" y="62" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f3f0e8">175ms의 위치 = 3.5</text>
<text x="52" y="90" font-family="sans-serif" font-size="16" fill="#a2afab">150ms부터 200ms까지 50ms, 그중 25ms 진행 → 보간 비율 0.5</text>
<line x1="180" y1="172" x2="780" y2="172" stroke="#a2afab" stroke-width="4"/>
<line x1="180" y1="172" x2="480" y2="172" stroke="#d9eea6" stroke-width="8"/>
<g font-family="sans-serif" text-anchor="middle">
<circle cx="180" cy="172" r="13" fill="#f3f0e8"/>
<circle cx="480" cy="172" r="14" fill="#d9eea6"/>
<circle cx="780" cy="172" r="13" fill="#f3f0e8"/>
<text x="180" y="147" font-size="22" fill="#f3f0e8">3</text>
<text x="480" y="147" font-size="23" font-weight="bold" fill="#d9eea6">3.5</text>
<text x="780" y="147" font-size="22" fill="#f3f0e8">4</text>
<text x="180" y="215" font-size="17" fill="#a2afab">150ms</text>
<text x="480" y="215" font-size="17" fill="#d9eea6">175ms</text>
<text x="780" y="215" font-size="17" fill="#a2afab">200ms</text>
</g>
<rect x="220" y="242" width="560" height="51" rx="10" fill="#080f17"/>
<text x="500" y="274" font-family="sans-serif" font-size="19" fill="#f3f0e8" text-anchor="middle">x = 3 + (4 − 3) × (25 / 50) = 3.5</text>
</svg>
