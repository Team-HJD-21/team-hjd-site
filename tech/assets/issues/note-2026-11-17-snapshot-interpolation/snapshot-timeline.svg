<circle cx="400" cy="175" r="9" fill="#d9eea6"/><text x="400" y="205">200</text>
<circle cx="520" cy="175" r="5" fill="#a2afab"/><text x="520" y="205">250</text>
<circle cx="580" cy="175" r="8" fill="#f3f0e8"/><text x="580" y="205">275</text>
