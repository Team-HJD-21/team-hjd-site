<text x="580" y="111" font-family="sans-serif" font-size="16" fill="#f3f0e8" text-anchor="middle">현재 기준</text>
<line x1="340" y1="240" x2="580" y2="240" stroke="#d9eea6" stroke-width="3"/>
<path d="M351 234 L340 240 L351 246 M569 234 L580 240 L569 246" fill="none" stroke="#d9eea6" stroke-width="3"/>
