<g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#f3f0e8">
<circle cx="160" cy="175" r="5" fill="#a2afab"/><text x="160" y="205">100</text>
<circle cx="280" cy="175" r="9" fill="#d9eea6"/><text x="280" y="205">150</text>
