<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" viewBox="0 0 1040 490" role="img" aria-labelledby="title desc"><title id="title">세대 핸들 검증 흐름</title><desc id="desc">핸들 인덱스 범위 검사, alive 검사, generation 일치 검사 순서. 슬롯 2의 현재 세대 2이므로 옛 핸들 2,1은 실패하고 새 핸들 2,2는 성공.</desc><rect width="1040" height="490" fill="#080f17"/><g font-family="Noto Sans KR,Arial,sans-serif"><text x="42" y="47" fill="#f3f0e8" font-size="25" font-weight="700">핸들로 데이터를 찾는 세 가지 검사</text><text x="42" y="76" fill="#a2afab" font-size="16">슬롯 2: alive=true, generation=2</text><rect x="36" y="118" width="215" height="86" rx="13" fill="#13202c" stroke="#a2afab"/><rect x="296" y="118" width="215" height="86" rx="13" fill="#13202c" stroke="#a2afab"/><rect x="556" y="118" width="215" height="86" rx="13" fill="#13202c" stroke="#a2afab"/><rect x="816" y="118" width="188" height="86" rx="13" fill="#24453c" stroke="#d9eea6"/><text x="55" y="147" fill="#f3f0e8" font-size="18">① 인덱스 범위</text><text x="55" y="179" fill="#d9eea6" font-size="17">2 &lt; 3 : 통과</text><text x="315" y="147" fill="#f3f0e8" font-size="18">② 슬롯 생존</text><text x="315" y="179" fill="#d9eea6" font-size="17">alive : 통과</text><text x="575" y="147" fill="#f3f0e8" font-size="18">③ 세대 일치</text><text x="575" y="179" fill="#d9eea6" font-size="17">현재 세대 2</text><text x="835" y="146" fill="#f3f0e8" font-size="18">세 조건 통과</text><text x="835" y="180" fill="#d9eea6" font-size="17">데이터 접근</text><path d="M253 160 H290 M282 152 L290 160 L282 168 M513 160 H550 M542 152 L550 160 L542 168 M773 160 H809 M801 152 L809 160 L801 168" stroke="#d9eea6" stroke-width="3" fill="none"/><rect x="58" y="265" width="444" height="142" rx="14" fill="#13202c"/><rect x="538" y="265" width="444" height="142" rx="14" fill="#13202c"/><text x="83" y="309" fill="#f3f0e8" font-size="22">옛 핸들 (2, 1)</text><text x="83" y="343" fill="#a2afab" font-size="18">1 ≠ 2 · 세대 불일치</text><text x="83" y="379" fill="#f3f0e8" font-size="20">✕ 무효 · 접근 중단</text><text x="563" y="309" fill="#f3f0e8" font-size="22">새 핸들 (2, 2)</text><text x="563" y="343" fill="#d9eea6" font-size="18">2 = 2 · 세대 일치</text><text x="563" y="379" fill="#d9eea6" font-size="20">✓ 유효 · 적 D 조회</text><path d="M665 210 V249 H280 V262" stroke="#a2afab" stroke-width="2" stroke-dasharray="6 5" fill="none"/><path d="M690 210 V238 H759 V262" stroke="#d9eea6" stroke-width="2" fill="none"/><text x="42" y="452" fill="#a2afab" font-size="15">범위 또는 생존 검사에 실패한 경우에도 즉시 접근을 중단합니다.</text></g></svg>