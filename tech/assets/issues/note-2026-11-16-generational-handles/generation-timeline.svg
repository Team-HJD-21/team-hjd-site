<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc"><title id="title">삭제와 재사용에 따라 바뀌는 슬롯 세대</title><desc id="desc">왼쪽 적 C 슬롯 2 세대 1, 가운데 삭제 후 슬롯 2 빈 칸 세대 2, 오른쪽 적 D 슬롯 2 세대 2. 이전 핸들 2,1은 무효.</desc><rect width="1040" height="440" fill="#080f17"/><g font-family="Noto Sans KR,Arial,sans-serif"><text x="44" y="52" fill="#f3f0e8" font-size="26" font-weight="700">같은 인덱스, 다른 생애</text><text x="44" y="82" fill="#a2afab" font-size="16">2번 칸은 다시 쓰지만, 세대 번호는 1에서 2로 바뀝니다.</text><rect x="35" y="112" width="296" height="254" rx="15" fill="#13202c"/><rect x="372" y="112" width="296" height="254" rx="15" fill="#13202c"/><rect x="709" y="112" width="296" height="254" rx="15" fill="#13202c"/><text x="59" y="155" fill="#f3f0e8" font-size="21">① 삭제 전</text><text x="396" y="155" fill="#f3f0e8" font-size="21">② C 삭제 후</text><text x="733" y="155" fill="#f3f0e8" font-size="21">③ D 생성 후</text><rect x="64" y="181" width="233" height="80" rx="9" fill="#36515a" stroke="#d9eea6" stroke-width="2"/><rect x="401" y="181" width="233" height="80" rx="9" fill="#20313d" stroke="#a2afab" stroke-dasharray="7 5" stroke-width="2"/><rect x="738" y="181" width="233" height="80" rx="9" fill="#36515a" stroke="#d9eea6" stroke-width="2"/><text x="83" y="210" fill="#f3f0e8" font-size="19">슬롯 2 · 적 C</text><text x="83" y="244" fill="#d9eea6" font-size="21">세대 1</text><text x="420" y="210" fill="#f3f0e8" font-size="19">슬롯 2 · 빈 칸</text><text x="420" y="244" fill="#d9eea6" font-size="21">세대 2</text><text x="757" y="210" fill="#f3f0e8" font-size="19">슬롯 2 · 적 D</text><text x="757" y="244" fill="#d9eea6" font-size="21">세대 2</text><text x="64" y="305" fill="#a2afab" font-size="17">발급: (2, 1)</text><text x="401" y="305" fill="#a2afab" font-size="17">옛 핸들: (2, 1) 무효</text><text x="738" y="305" fill="#d9eea6" font-size="17">새 핸들: (2, 2) 유효</text><path d="M333 220 H370 M361 212 L370 220 L361 228" stroke="#d9eea6" stroke-width="3" fill="none"/><path d="M670 220 H707 M698 212 L707 220 L698 228" stroke="#d9eea6" stroke-width="3" fill="none"/><text x="44" y="406" fill="#a2afab" font-size="15">예시 규칙: 삭제 때 세대 +1 · 인덱스는 재사용 · 남아 있는 오래된 참조는 거부</text></g></svg>