<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-label="다섯 객체의 전체 열 쌍에서 셀별 다섯 방문, 중복 제거 후 네 후보, AABB 겹침 두 쌍으로 줄어드는 흐름"><rect width="1100" height="570" fill="#080f17"/><rect x="22" y="20" width="1056" height="530" rx="18" fill="#13202c"/><text x="54" y="67" fill="#f3f0e8" font-size="29" font-family="sans-serif">후보 쌍은 어디서 줄어들까요?</text><text x="54" y="102" fill="#a2afab" font-size="17" font-family="sans-serif">설명용 다섯 상자 · 실제 엔진의 호출 횟수나 프레임 속도 측정값은 아닙니다.</text><rect x="58" y="155" width="225" height="159" rx="15" fill="#080f17" stroke="#70828b" stroke-width="2"/><text x="170" y="195" font-size="19" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif">전체 조합</text><text x="170" y="256" font-size="48" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif">10</text><text x="170" y="294" font-size="15" text-anchor="middle" fill="#a2afab" font-family="sans-serif">5×4÷2</text><path d="M289 233 h25 m-10 -8 l10 8 -10 8" stroke="#d9eea6" fill="none" stroke-width="3"/><rect x="324" y="155" width="225" height="159" rx="15" fill="#080f17" stroke="#70828b" stroke-width="2"/><text x="436" y="195" font-size="19" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif">셀 내부 방문</text><text x="436" y="256" font-size="48" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif">5</text><text x="436" y="294" font-size="15" text-anchor="middle" fill="#a2afab" font-family="sans-serif">AB 두 번 포함</text><path d="M555 233 h25 m-10 -8 l10 8 -10 8" stroke="#d9eea6" fill="none" stroke-width="3"/><rect x="590" y="155" width="225" height="159" rx="15" fill="#080f17" stroke="#70828b" stroke-width="2"/><text x="702" y="195" font-size="19" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif">고유 후보</text><text x="702" y="256" font-size="48" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif">4</text><text x="702" y="294" font-size="15" text-anchor="middle" fill="#a2afab" font-family="sans-serif">AB · AC · BC · DE</text><path d="M821 233 h25 m-10 -8 l10 8 -10 8" stroke="#d9eea6" fill="none" stroke-width="3"/><rect x="856" y="155" width="225" height="159" rx="15" fill="#080f17" stroke="#d9eea6" stroke-width="2"/><text x="968" y="195" font-size="19" text-anchor="middle" fill="#f3f0e8" font-family="sans-serif">AABB 겹침</text><text x="968" y="256" font-size="48" text-anchor="middle" fill="#d9eea6" font-family="sans-serif">2</text><text x="968" y="294" font-size="15" text-anchor="middle" fill="#a2afab" font-family="sans-serif">AB · DE</text><rect x="58" y="360" width="1024" height="155" rx="12" fill="#080f17"/><text x="84" y="395" fill="#f3f0e8" font-family="sans-serif" font-size="19">셀 0: A, B    |    셀 1: A, B, C    |    셀 2: —    |    셀 3: D, E    |    셀 4: E</text><text x="84" y="433" fill="#a2afab" font-family="sans-serif" font-size="19">셀 0에서 AB, 셀 1에서 AB·AC·BC, 셀 3에서 DE를 만납니다.</text><text x="84" y="473" fill="#d9eea6" font-family="sans-serif" font-size="19">중복 AB를 한 번만 남기고, AABB 겹침 검사로 AC·BC를 제외합니다.</text></svg>