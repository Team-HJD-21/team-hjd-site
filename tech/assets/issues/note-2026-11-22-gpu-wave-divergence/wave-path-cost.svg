<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="혼합 두 워프의 가상 명령 발행 24회와 유형별 두 워프의 12회 비교">
<rect x="0" y="0" width="1200" height="470" rx="0" fill="#080f17"/>
<text x="55" y="60" fill="#f3f0e8" font-family="Arial, sans-serif" font-size="30" font-weight="700">두 경로가 섞이면 워프 명령도 늘어납니다</text>
<text x="55" y="92" fill="#a2afab" font-family="Arial, sans-serif" font-size="18" font-weight="400">가상 조건: H 경로 8명령 · L 경로 4명령 / 32레인 워프 2개</text>
<rect x="40" y="119" width="1120" height="298" rx="14" fill="#13202c"/>
<line x1="340" y1="146" x2="340" y2="367" stroke="#39505c" stroke-width="1"/>
<text x="333" y="394" fill="#a2afab" font-family="Arial, sans-serif" font-size="15" font-weight="400">0</text>
<line x1="456" y1="146" x2="456" y2="367" stroke="#39505c" stroke-width="1"/>
<text x="449" y="394" fill="#a2afab" font-family="Arial, sans-serif" font-size="15" font-weight="400">4</text>
<line x1="572" y1="146" x2="572" y2="367" stroke="#39505c" stroke-width="1"/>
<text x="565" y="394" fill="#a2afab" font-family="Arial, sans-serif" font-size="15" font-weight="400">8</text>
<line x1="688" y1="146" x2="688" y2="367" stroke="#39505c" stroke-width="1"/>
<text x="681" y="394" fill="#a2afab" font-family="Arial, sans-serif" font-size="15" font-weight="400">12</text>
<line x1="804" y1="146" x2="804" y2="367" stroke="#39505c" stroke-width="1"/>
<text x="797" y="394" fill="#a2afab" font-family="Arial, sans-serif" font-size="15" font-weight="400">16</text>
<line x1="920" y1="146" x2="920" y2="367" stroke="#39505c" stroke-width="1"/>
<text x="913" y="394" fill="#a2afab" font-family="Arial, sans-serif" font-size="15" font-weight="400">20</text>
<line x1="1036" y1="146" x2="1036" y2="367" stroke="#39505c" stroke-width="1"/>
<text x="1029" y="394" fill="#a2afab" font-family="Arial, sans-serif" font-size="15" font-weight="400">24</text>
<text x="65" y="198" fill="#f3f0e8" font-family="Arial, sans-serif" font-size="21" font-weight="650">혼합 W0 + W1</text>
<text x="65" y="224" fill="#a2afab" font-family="Arial, sans-serif" font-size="17" font-weight="400">2 × (8 + 4)</text>
<text x="65" y="311" fill="#f3f0e8" font-family="Arial, sans-serif" font-size="21" font-weight="650">유형별 W0 + W1</text>
<text x="65" y="337" fill="#a2afab" font-family="Arial, sans-serif" font-size="17" font-weight="400">8 + 4</text>
<rect x="340" y="175" width="229" height="49" rx="4" fill="#d9eea6"/>
<rect x="572" y="175" width="113" height="49" rx="4" fill="#679baf"/>
<rect x="688" y="175" width="229" height="49" rx="4" fill="#d9eea6"/>
<rect x="920" y="175" width="113" height="49" rx="4" fill="#679baf"/>
<rect x="340" y="290" width="229" height="49" rx="4" fill="#d9eea6"/>
<rect x="572" y="290" width="113" height="49" rx="4" fill="#679baf"/>
<text x="1050" y="165" fill="#f3f0e8" font-family="Arial, sans-serif" font-size="25" font-weight="700">24</text>
<text x="705" y="277" fill="#f3f0e8" font-family="Arial, sans-serif" font-size="25" font-weight="700">12</text>
<text x="400" y="447" fill="#a2afab" font-family="Arial, sans-serif" font-size="17" font-weight="400">H: 밝은 연두    L: 파랑    |    워프 명령 수의 합계 ≠ GPU 실행 시간</text>
</svg>