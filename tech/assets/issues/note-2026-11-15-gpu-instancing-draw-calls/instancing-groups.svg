<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">머티리얼에 따른 인스턴스 그룹 분리</title><desc id="desc">같은 메시 열 개 중 머티리얼 A인 여섯 개와 B인 네 개는 두 개의 인스턴싱 그룹으로 나눈다는 설명도</desc><rect width="960" height="390" fill="#080f17"/><g font-family="Noto Sans KR,Arial,sans-serif"><rect x="38" y="43" width="884" height="307" rx="18" fill="#13202c"/><text x="64" y="85" fill="#f3f0e8" font-size="24" font-weight="700">메시는 같지만 머티리얼은 두 종류</text><text x="64" y="118" fill="#a2afab" font-size="15">예제: 적 10명 = A 재질 6명 + B 재질 4명</text><text x="70" y="165" fill="#f3f0e8" font-size="18">그룹 A (6개)</text><rect x="262" y="134" width="43" height="43" rx="7" fill="#d9eea6" stroke="#a2afab" stroke-width="1.5"/><rect x="320" y="134" width="43" height="43" rx="7" fill="#d9eea6" stroke="#a2afab" stroke-width="1.5"/><rect x="378" y="134" width="43" height="43" rx="7" fill="#d9eea6" stroke="#a2afab" stroke-width="1.5"/><rect x="436" y="134" width="43" height="43" rx="7" fill="#d9eea6" stroke="#a2afab" stroke-width="1.5"/><rect x="494" y="134" width="43" height="43" rx="7" fill="#d9eea6" stroke="#a2afab" stroke-width="1.5"/><rect x="552" y="134" width="43" height="43" rx="7" fill="#d9eea6" stroke="#a2afab" stroke-width="1.5"/><path d="M260 184 H604" stroke="#d9eea6" stroke-width="3"/><text x="651" y="163" fill="#d9eea6" font-size="17">제출 1회</text><text x="70" y="260" fill="#f3f0e8" font-size="18">그룹 B (4개)</text><rect x="262" y="229" width="43" height="43" rx="7" fill="#4e7c8c" stroke="#a2afab" stroke-width="1.5"/><rect x="320" y="229" width="43" height="43" rx="7" fill="#4e7c8c" stroke="#a2afab" stroke-width="1.5"/><rect x="378" y="229" width="43" height="43" rx="7" fill="#4e7c8c" stroke="#a2afab" stroke-width="1.5"/><rect x="436" y="229" width="43" height="43" rx="7" fill="#4e7c8c" stroke="#a2afab" stroke-width="1.5"/><path d="M260 279 H491" stroke="#4e7c8c" stroke-width="3"/><text x="651" y="258" fill="#a2afab" font-size="17">제출 1회</text><text x="70" y="326" fill="#a2afab" font-size="14">개념적 최소 두 그룹 · 실제 GPU 호출 수는 패스와 렌더 상태에 따라 달라짐</text></g></svg>