<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">GPU 인스턴싱 전후 명령 제출 구조</title><desc id="desc">같은 메시 열 개를 개별 그리기 명령 열 번으로 제출하거나, 인스턴싱 한 번으로 제출해도 GPU의 메시 복제는 열 개인 비교도</desc><rect width="960" height="390" fill="#080f17"/><g font-family="Noto Sans KR,Arial,sans-serif"><rect x="36" y="45" width="421" height="302" rx="18" fill="#13202c"/><rect x="503" y="45" width="421" height="302" rx="18" fill="#13202c"/><text x="64" y="86" fill="#f3f0e8" font-size="23" font-weight="700">개별 제출</text><text x="530" y="86" fill="#f3f0e8" font-size="23" font-weight="700">GPU 인스턴싱</text><text x="64" y="120" fill="#a2afab" font-size="16">동일 메시 + 동일 머티리얼</text><text x="530" y="120" fill="#a2afab" font-size="16">동일 메시 + 동일 머티리얼</text><rect x="82" y="154" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="106" y="181" font-size="13" text-anchor="middle" fill="#f3f0e8">1</text><rect x="145" y="154" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="169" y="181" font-size="13" text-anchor="middle" fill="#f3f0e8">2</text><rect x="208" y="154" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="232" y="181" font-size="13" text-anchor="middle" fill="#f3f0e8">3</text><rect x="271" y="154" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="295" y="181" font-size="13" text-anchor="middle" fill="#f3f0e8">4</text><rect x="334" y="154" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="358" y="181" font-size="13" text-anchor="middle" fill="#f3f0e8">5</text><rect x="82" y="226" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="106" y="253" font-size="13" text-anchor="middle" fill="#f3f0e8">6</text><rect x="145" y="226" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="169" y="253" font-size="13" text-anchor="middle" fill="#f3f0e8">7</text><rect x="208" y="226" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="232" y="253" font-size="13" text-anchor="middle" fill="#f3f0e8">8</text><rect x="271" y="226" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="295" y="253" font-size="13" text-anchor="middle" fill="#f3f0e8">9</text><rect x="334" y="226" width="48" height="43" rx="6" fill="#13202c" stroke="#a2afab"/><text x="358" y="253" font-size="13" text-anchor="middle" fill="#f3f0e8">10</text><text x="72" y="317" fill="#d9eea6" font-size="19" font-weight="700">개념적 제출 10회</text><rect x="538" y="168" width="344" height="64" rx="12" fill="#d9eea6"/><text x="710" y="204" text-anchor="middle" fill="#080f17" font-size="22" font-weight="700">1개 instanced draw</text><path d="M710 234 V268" stroke="#a2afab" stroke-width="3"/><path d="M701 258 L710 270 L719 258" fill="none" stroke="#a2afab" stroke-width="3"/><text x="710" y="302" fill="#f3f0e8" text-anchor="middle" font-size="17">GPU는 메시 10개를 렌더링</text><text x="710" y="326" fill="#a2afab" text-anchor="middle" font-size="14">위치별 행렬 10개 전달</text></g></svg>